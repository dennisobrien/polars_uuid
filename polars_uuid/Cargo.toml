[package]
name = "polars_uuid"
version = "0.1.0"
edition = "2024"

[lib]
name = "polars_uuid"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.52.0", features = ["dtype-datetime"], default-features = false }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.19.0", features = ["v4", "v5", "v7"] }
