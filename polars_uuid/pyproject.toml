[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-uuid-plugin"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  'polars >= 1.32.0',
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
authors = [
    { name="Dennis O'Brien", email="[EMAIL_ADDRESS]"},
]
description = "UUID functions for Polars"
readme = "README.md"
dynamic = ["version"]

[project.urls]
"Homepage" = "https://github.com/dennisobrien/polars_uuid"
"Bug Tracker" = "https://github.com/dennisobrien/polars_uuid/issues"

[tool.maturin]
module-name = "polars_uuid._internal"

[tool.ruff]
src = ["polars_uuid", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["polars_uuid"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "maturin>=1.13.3",
    "numpy>=2.2.6",
    "pandas>=2.2.0",
    "pytest>=9.0.3",
]
